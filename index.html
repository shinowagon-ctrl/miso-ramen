<title>思い出の函館味噌ラーメン</title>
<style>

.btn{background:#7a2414;color:#fff3dc;border:2px solid #e8c48a;border-radius:8px;padding:16px 34px;font-size:20px;font-family:inherit;margin:14px;cursor:pointer;min-height:56px}
#menu{display:flex;gap:10px;flex-direction:row-reverse;margin:16px}
.tan{writing-mode:vertical-rl;background:#f3e6c4;color:#2a160a;padding:16px 10px;font-size:22px;border:1px solid #a88;min-height:170px;box-shadow:2px 3px 6px rgba(0,0,0,.5);cursor:pointer;font-weight:bold}

#bar{position:fixed;left:0;right:0;bottom:0;padding:10px calc(8px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));display:none;gap:8px;justify-content:center;flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,0,0,.65));z-index:4}

#bar button:disabled{opacity:.28}

@media (orientation:landscape) and (max-height:500px){#bar{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}#bar button{min-height:44px;padding:8px 12px;font-size:15px}.tan{min-height:120px;font-size:18px}#date{bottom:calc(70px + env(safe-area-inset-bottom))}}

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="wrap"><div id="vig"></div><div id="date">'07 11 03</div></div>
<div id="hint"></div>
<div id="tools"><button id="filmBtn">📷 フィルム</button><button id="sndBtn">🔊</button></div>

<div class="ov" id="ovEnter"><h1>函館の、あの一杯</h1><p>のれんをくぐると、味噌の香り。<br>カウンター席が空いている。</p><button class="btn" id="enterBtn">のれんをくぐる</button></div>

<p style="font-size:13px">短冊をえらんでください</p></div>
<div class="ov hide" id="ovEnd"><h1>ごちそうさまでした</h1><p>今日の食べ順</p><div id="order"></div><button class="btn" id="againBtn">もう一杯</button></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const isMobile=/iPhone|iPad|Android/i.test(navigator.userAgent)||matchMedia('(pointer:coarse)').matches;
// quality tiers: 2 high, 1 mid, 0 low
let tier=isMobile?1:2;
const TIERS=[{pr:1,shadow:false,steam:8},{pr:Math.min(devicePixelRatio,1.75),shadow:true,map:1024,steam:14},{pr:Math.min(devicePixelRatio,2),shadow:true,map:2048,steam:24}];
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('wrap').prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x120c08);scene.fog=new THREE.Fog(0x120c08,1.2,4.5);
const pmrem=new THREE.PMREMGenerator(renderer);
const envRT=pmrem.fromScene(new RoomEnvironment(),0.04);scene.environment=envRT.texture;scene.environmentIntensity=0.55;
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.01,20);

// ---------- helpers ----------
const R=(a,b)=>a+Math.random()*(b-a);
function mkCanvas(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return c;}
function tex(c,{srgb=true,rep}={}){const t=new THREE.CanvasTexture(c);t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
const ctex=(w,h,draw,rep)=>tex(mkCanvas(w,h,draw),{rep});
// height canvas -> tangent-space normal map
function normalFrom(c,strength=2){const w=c.width,h=c.height,src=c.getContext('2d').getImageData(0,0,w,h).data;const out=mkCanvas(w,h,()=>{});const g=out.getContext('2d');const id=g.createImageData(w,h);
 const H=(x,y)=>src[(((y+h)%h)*w+((x+w)%w))*4]/255;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const dx=(H(x+1,y)-H(x-1,y))*strength,dy=(H(x,y+1)-H(x,y-1))*strength;const l=Math.hypot(dx,dy,1);const i=(y*w+x)*4;id.data[i]=(-dx/l*.5+.5)*255;id.data[i+1]=(dy/l*.5+.5)*255;id.data[i+2]=(1/l*.5+.5)*255;id.data[i+3]=255;}
 g.putImageData(id,0,0);return tex(out,{srgb:false});}
function noiseCanvas(w,h,n,rmin,rmax,base='#808080',seedCol=()=>`rgba(255,255,255,${R(.05,.25)})`){return mkCanvas(w,h,(g)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<n;i++){g.fillStyle=seedCol();g.beginPath();g.arc(R(0,w),R(0,h),R(rmin,rmax),0,7);g.fill();}});}

// ---------- lights: food-commercial setup (warm key back-left, soft fill, rim) ----------
scene.add(new THREE.HemisphereLight(0xffdcae,0x24140a,0.42));
const key=new THREE.DirectionalLight(0xffe0b4,2.6);key.position.set(-0.6,1.2,-0.5);key.castShadow=true;
key.shadow.camera.left=-0.4;key.shadow.camera.right=0.4;key.shadow.camera.top=0.4;key.shadow.camera.bottom=-0.4;key.shadow.camera.near=0.2;key.shadow.camera.far=3;key.shadow.bias=-0.0003;key.shadow.normalBias=0.002;key.shadow.radius=6;
scene.add(key);
const fill=new THREE.PointLight(0xffc890,0.9,3,1.5);fill.position.set(0.5,0.45,0.6);scene.add(fill);
const rimL=new THREE.SpotLight(0xffd8a8,6,3,0.6,0.8,1.5);rimL.position.set(0.4,0.6,-0.9);rimL.target.position.set(0,0.05,0);scene.add(rimL,rimL.target);
const lamp=new THREE.PointLight(0xffa860,1.2,4);lamp.position.set(0,1.3,-1.2);scene.add(lamp);

// ---------- counter ----------
const woodC=mkCanvas(1024,1024,(g,w,h)=>{g.fillStyle='#24170e';g.fillRect(0,0,w,h);for(let i=0;i<160;i++){g.strokeStyle=`rgba(${40+R(0,18)|0},${26+R(0,12)|0},${16+R(0,8)|0},${R(.08,.22)})`;g.lineWidth=R(2,7);g.beginPath();let y=R(0,h);g.moveTo(0,y);for(let x=0;x<=w;x+=24){y+=R(-2,2);g.lineTo(x,y+Math.sin(x*.008+i)*5);}g.stroke();}
 for(let i=0;i<30;i++){g.fillStyle=`rgba(255,235,210,${R(.01,.03)})`;g.fillRect(R(0,w),R(0,h),R(40,200),R(1,2));}});
const woodTex=tex(woodC,{rep:[2,1]});
const woodRough=tex(mkCanvas(512,512,(g,w,h)=>{g.fillStyle='#909090';g.fillRect(0,0,w,h);for(let i=0;i<300;i++){g.strokeStyle=`rgba(${R(80,200)|0},${R(80,200)|0},${R(80,200)|0},.3)`;g.beginPath();const y=R(0,h);g.moveTo(0,y);g.lineTo(w,y+R(-6,6));g.stroke();}}),{srgb:false,rep:[2,1]});
const woodBump=normalFrom(mkCanvas(512,512,(g,w,h)=>{g.fillStyle='#808080';g.fillRect(0,0,w,h);for(let i=0;i<160;i++){g.strokeStyle=`rgba(0,0,0,${R(.1,.4)})`;g.lineWidth=R(1,3);g.beginPath();let y=R(0,h);g.moveTo(0,y);for(let x=0;x<=w;x+=16){y+=R(-1,1);g.lineTo(x,y);}g.stroke();}}),1.5);woodBump.wrapS=woodBump.wrapT=THREE.RepeatWrapping;woodBump.repeat.set(2,1);
const counter=new THREE.Mesh(new THREE.BoxGeometry(3.2,0.05,1.2),new THREE.MeshPhysicalMaterial({map:woodTex,roughnessMap:woodRough,normalMap:woodBump,normalScale:new THREE.Vector2(.4,.4),roughness:0.75,clearcoat:0.25,clearcoatRoughness:0.5}));
counter.position.set(0,-0.025,-0.1);counter.receiveShadow=true;scene.add(counter);
// back wall with properly fitted vertical menu strips
const MENU=['味噌ラーメン','塩ラーメン','醤油ラーメン','チャーシュー麺','バターコーン','餃子','ライス','ビール'];
const wallTex=ctex(2048,1024,(g,w,h)=>{g.fillStyle='#5a3d24';g.fillRect(0,0,w,h);for(let i=0;i<200;i++){g.fillStyle=`rgba(0,0,0,${R(.02,.08)})`;g.fillRect(R(0,w),R(0,h),R(2,6),R(40,200));}
 g.fillStyle='#2c1b0e';g.fillRect(0,h*.7,w,h*.3);
 const sw=150,gap=(w-MENU.length*sw)/(MENU.length+1);
 MENU.forEach((s,i)=>{const x=gap+i*(sw+gap),y=80,hh=560;g.fillStyle='#ece0bf';g.fillRect(x,y,sw,hh);g.strokeStyle='#8a6d44';g.lineWidth=3;g.strokeRect(x,y,sw,hh);
  const chars=[...s.replace('ー','｜')];const fs=Math.min(78,(hh-60)/chars.length);g.fillStyle='#1e120a';g.font=`bold ${fs}px serif`;g.textAlign='center';g.textBaseline='top';chars.forEach((ch,j)=>g.fillText(ch,x+sw/2,y+30+j*fs));});
 g.fillStyle='#a8261a';g.fillRect(0,680,w,22);});
const wall=new THREE.Mesh(new THREE.PlaneGeometry(4,2),new THREE.MeshStandardMaterial({map:wallTex,roughness:.9}));wall.position.set(0,0.9,-1.6);scene.add(wall);
const front=new THREE.Mesh(new THREE.BoxGeometry(3.2,0.3,0.06),new THREE.MeshStandardMaterial({color:0x2a180c,roughness:.7}));front.position.set(0,0.13,-0.72);scene.add(front);

// glass, bottles, sleeve
const glass=new THREE.Mesh(new THREE.CylinderGeometry(0.034,0.029,0.10,40,1,true),new THREE.MeshPhysicalMaterial({color:0xffffff,transmission:1,roughness:0.03,thickness:0.004,ior:1.5,side:2,transparent:true}));
glass.position.set(0.20,0.05,-0.36);scene.add(glass);
const water=new THREE.Mesh(new THREE.CylinderGeometry(0.031,0.028,0.07,40),new THREE.MeshPhysicalMaterial({color:0xeaf4ff,transmission:1,roughness:0.02,ior:1.33,thickness:.05,transparent:true}));water.position.set(0.20,0.036,-0.36);scene.add(water);
const labelTex=ctex(256,128,(g,w,h)=>{g.fillStyle='#eee';g.fillRect(0,0,w,h);g.fillStyle='#b3201a';g.fillRect(0,0,w,26);g.fillRect(0,h-20,w,20);g.fillStyle='#222';g.font='bold 40px serif';g.fillText('醤油',80,85);});
[[-0.30,-0.40],[-0.23,-0.43],[-0.16,-0.44]].forEach(([x,z],i)=>{const b=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.03,0.11,32),new THREE.MeshPhysicalMaterial({color:0x1a0a06,roughness:.08,transmission:.35,thickness:.03,clearcoat:1}));body.position.y=.055;
 const lab=new THREE.Mesh(new THREE.CylinderGeometry(0.0305,0.0305,0.045,32,1,true),new THREE.MeshStandardMaterial({map:labelTex}));lab.position.y=.05;
 const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.022,0.03,24),new THREE.MeshStandardMaterial({color:i==1?0xc0281e:0x222222,roughness:.4}));cap.position.y=.125;
 b.add(body,lab,cap);b.position.set(x,0,z);b.traverse(o=>o.castShadow=true);scene.add(b);});
const sleeveTex=ctex(512,96,(g,w,h)=>{g.fillStyle='#f6f2ea';g.fillRect(0,0,w,h);g.fillStyle='#d4361f';g.fillRect(0,0,w*.62,h);g.fillStyle='#fff';g.font='bold 40px sans-serif';g.fillText('ラーメン',40,62);g.fillStyle='#c22';g.font='bold 46px serif';g.fillText('め ん',w*.68,64);});
const sleeve=new THREE.Mesh(new THREE.BoxGeometry(0.21,0.002,0.035),new THREE.MeshStandardMaterial({map:sleeveTex,roughness:.8}));sleeve.position.set(0.24,0.001,0.10);sleeve.rotation.y=0.3;scene.add(sleeve);

// ---------- suribachi bowl (wider, deeper, matte brown glaze, lighter unglazed inner band) ----------
const BR=0.135, BH=0.095, BOT=0.04;
const innerR=y=>BOT+(BR-BOT)*Math.pow(Math.max(0,y)/BH,0.75);
const pts=[new THREE.Vector2(0,-0.012),new THREE.Vector2(0.048,-0.012),new THREE.Vector2(0.05,-0.002),new THREE.Vector2(0.056,0.002)];
for(let i=0;i<=24;i++){const t=i/24,y=t*BH;pts.push(new THREE.Vector2(innerR(y)+0.007+0.005*(1-t)+Math.sin(t*3.1)*0.003,y));}
pts.push(new THREE.Vector2(BR+0.009,BH+0.006));pts.push(new THREE.Vector2(BR+0.004,BH+0.009));pts.push(new THREE.Vector2(BR-0.001,BH+0.006));
const glazeC=mkCanvas(1024,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#3a1208');gr.addColorStop(.5,'#5e200e');gr.addColorStop(.9,'#702c14');gr.addColorStop(1,'#521a0a');g.fillStyle=gr;g.fillRect(0,0,w,h);
 for(let i=0;i<4000;i++){g.fillStyle=`rgba(${R(10,110)|0},${R(5,45)|0},${R(0,15)|0},${R(.05,.25)})`;g.fillRect(R(0,w),R(0,h),R(1,4),R(1,4));}
 for(let i=0;i<120;i++){g.strokeStyle=`rgba(120,55,25,${R(.05,.2)})`;g.lineWidth=R(1,5);const x=R(0,w);g.beginPath();g.moveTo(x,h*.55);g.lineTo(x+R(-6,6),h);g.stroke();}});
const glazeN=normalFrom(noiseCanvas(512,256,3000,.5,2.5),1.2);
const glaze=new THREE.MeshPhysicalMaterial({map:tex(glazeC),normalMap:glazeN,normalScale:new THREE.Vector2(.3,.3),roughness:0.42,clearcoat:0.35,clearcoatRoughness:0.35});
const bowl=new THREE.Group();scene.add(bowl);
const bowlOuter=new THREE.Mesh(new THREE.LatheGeometry(pts,128),glaze);bowlOuter.castShadow=true;bowlOuter.receiveShadow=true;bowl.add(bowlOuter);
const ipts=[new THREE.Vector2(0.0001,0.0001)];for(let i=0;i<=48;i++){const y=BH*i/48+0.0001;ipts.push(new THREE.Vector2(innerR(y),y));}
const N_SEC=12;
const suriC=mkCanvas(2048,1024,(g,w,h)=>{ // v: 0 bottom -> 1 rim (lathe v follows points)
 const gr=g.createLinearGradient(0,h,0,0);gr.addColorStop(0,'#4a180a');gr.addColorStop(.7,'#62230e');gr.addColorStop(.86,'#6e2c14');gr.addColorStop(.88,'#a7794e');gr.addColorStop(.97,'#b48558');gr.addColorStop(1,'#3e1a0b');
 g.fillStyle=gr;g.fillRect(0,0,w,h);
 const sw=w/N_SEC;for(let s=0;s<N_SEC;s++){for(let k=0;k<12;k++){const x0=s*sw+k*(sw/12);g.strokeStyle='rgba(20,6,2,.6)';g.lineWidth=3;g.beginPath();g.moveTo(x0,h*.92);g.lineTo(x0+sw*.1,h*.1);g.stroke();g.strokeStyle='rgba(200,130,80,.22)';g.lineWidth=1.5;g.beginPath();g.moveTo(x0+3,h*.92);g.lineTo(x0+3+sw*.1,h*.1);g.stroke();}}
 for(let i=0;i<3000;i++){g.fillStyle=`rgba(${R(30,150)|0},${R(15,80)|0},${R(5,40)|0},${R(.05,.2)})`;g.fillRect(R(0,w),R(h*.05,h*.98),R(1,4),R(1,4));}});
const suriH=mkCanvas(2048,512,(g,w,h)=>{g.fillStyle='#999';g.fillRect(0,0,w,h);const sw=w/N_SEC;for(let s=0;s<N_SEC;s++)for(let k=0;k<12;k++){const x0=s*sw+k*(sw/12);g.strokeStyle='#222';g.lineWidth=4;g.beginPath();g.moveTo(x0,h*.92);g.lineTo(x0+sw*.1,h*.1);g.stroke();}});
const suriTex=tex(suriC);suriTex.flipY=true;
const innerMat=new THREE.MeshPhysicalMaterial({map:suriTex,normalMap:normalFrom(suriH,3),normalScale:new THREE.Vector2(.9,.9),roughness:.7,clearcoat:.15,side:THREE.DoubleSide});
const bowlInner=new THREE.Mesh(new THREE.LatheGeometry(ipts,160),innerMat);bowlInner.receiveShadow=true;bowl.add(bowlInner);
const bottom=new THREE.Mesh(new THREE.CircleGeometry(BOT+0.002,64),new THREE.MeshPhysicalMaterial({color:0x5a2a14,roughness:.7,normalMap:glazeN}));bottom.rotation.x=-Math.PI/2;bottom.position.y=0.0012;bottom.receiveShadow=true;bowl.add(bottom);
const rim=new THREE.Mesh(new THREE.TorusGeometry(BR+0.004,0.005,16,160),glaze);rim.rotation.x=Math.PI/2;rim.position.y=BH+0.006;bowl.add(rim);
// soft contact shadow (AO approximation)
const aoTex=ctex(256,256,(g,w,h)=>{const gr=g.createRadialGradient(128,128,40,128,128,128);gr.addColorStop(0,'rgba(0,0,0,.85)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);});
const ao=new THREE.Mesh(new THREE.PlaneGeometry(0.26,0.26),new THREE.MeshBasicMaterial({map:aoTex,transparent:true,depthWrite:false}));ao.rotation.x=-Math.PI/2;ao.position.y=0.0005;bowl.add(ao);

// ---------- soup: creamy miso, fine foam & oil, glossy ----------
const SOUP_FULL=BH*0.84;let soupLevel=1;
const soupC=mkCanvas(1024,1024,(g,w,h)=>{g.fillStyle='#d6ad62';g.fillRect(0,0,w,h);
 for(let i=0;i<220;i++){const gr=g.createRadialGradient(0,0,0,0,0,1);const x=R(0,w),y=R(0,h),r=R(30,140);g.fillStyle=`rgba(${R(185,235)|0},${R(140,185)|0},${R(60,95)|0},${R(.08,.24)})`;g.beginPath();g.arc(x,y,r,0,7);g.fill();}

let AC=null,master=null,muted=false,ambNodes=[];
function audioInit(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);
 // shop murmur: filtered brown noise
 const len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=(l+0.02*(Math.random()*2-1))/1.02;d[i]=l*3.2;}
 const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.6;const g=AC.createGain();g.gain.value=.25;src.connect(bp).connect(g).connect(master);src.start();
 // steam hiss
 const nb=noiseBuf(2);const s2=AC.createBufferSource();s2.buffer=nb;s2.loop=true;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=5000;const g2=AC.createGain();g2.gain.value=0;s2.connect(hp).connect(g2).connect(master);s2.start();ambNodes.steam=g2;
 setInterval(()=>{if(!AC||muted)return;if(Math.random()<.35)clatter(R(.02,.06));},1400);}
function noiseBuf(sec){const len=AC.sampleRate*sec,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return b;}
function clink(f=2400,vol=.25){if(!AC)return;const t=AC.currentTime;[1,2.76,5.4].forEach((k,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f*k;g.gain.setValueAtTime(vol/(i+1),t);g.gain.exponentialRampToValueAtTime(.0001,t+.35/(i+1));o.connect(g).connect(master);o.start(t);o.stop(t+.4);});}
function clatter(v){if(!AC)return;const t=AC.currentTime;for(let i=0;i<3;i++){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=R(1200,3500);g.gain.setValueAtTime(v,t+i*.06);g.gain.exponentialRampToValueAtTime(.0001,t+i*.06+.15);o.connect(g).connect(master);o.start(t+i*.06);o.stop(t+i*.06+.2);}}
function slurp(dur=1.0,strong=1){if(!AC)return;const t=AC.currentTime;const s=AC.createBufferSource();s.buffer=noiseBuf(dur+.1);const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=2.5;
 bp.frequency.setValueAtTime(700,t);bp.frequency.linearRampToValueAtTime(2600,t+dur);const g=AC.createGain();g.gain.setValueAtTime(0,t);
 for(let k=0;k<dur*9;k++){g.gain.linearRampToValueAtTime(.5*strong*R(.4,1),t+k/9+.04);g.gain.linearRampToValueAtTime(.08,t+k/9+.1);}g.gain.linearRampToValueAtTime(0,t+dur);s.connect(bp).connect(g).connect(master);s.start(t);}
function chew(n=4){if(!AC)return;const t=AC.currentTime;for(let i=0;i<n;i++){const s=AC.createBufferSource();s.buffer=noiseBuf(.12);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;const g=AC.createGain();g.gain.setValueAtTime(.0001,t+i*.28);g.gain.linearRampToValueAtTime(.25,t+i*.28+.03);g.gain.exponentialRampToValueAtTime(.0001,t+i*.28+.12);s.connect(lp).connect(g).connect(master);s.start(t+i*.28);}}
function crunch(n=5){if(!AC)return;const t=AC.currentTime;for(let i=0;i<n;i++){const s=AC.createBufferSource();s.buffer=noiseBuf(.06);const hp=AC.createBiquadFilter();hp.type='bandpass';hp.frequency.value=3000;const g=AC.createGain();g.gain.setValueAtTime(.3,t+i*.18);g.gain.exponentialRampToValueAtTime(.0001,t+i*.18+.05);s.connect(hp).connect(g).connect(master);s.start(t+i*.18);}}
function kitchen(sec){if(!AC)return;const t=AC.currentTime;const s=AC.createBufferSource();s.buffer=noiseBuf(sec);const bp=AC.createBiquadFilter();bp.type='highpass';bp.frequency.value=1800;const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.5);g.gain.linearRampToValueAtTime(.18,t+sec*.6);g.gain.linearRampToValueAtTime(0,t+sec);s.connect(bp).connect(g).connect(master);s.start(t);
 for(let i=0;i<5;i++)setTimeout(()=>clatter(.08),R(200,sec*1000-300));}
document.getElementById('sndBtn').onclick=()=>{muted=!muted;if(master)master.gain.value=muted?0:.8;sndBtn.textContent=muted?'🔇':'🔊';};



// ---------- ripples ----------
const rippleTex=ctex(256,256,(g,w,h)=>{g.strokeStyle='rgba(255,250,235,.9)';g.lineWidth=6;g.beginPath();g.arc(128,128,110,0,7);g.stroke();g.strokeStyle='rgba(255,250,235,.4)';g.lineWidth=3;g.beginPath();g.arc(128,128,90,0,7);g.stroke();});
const ripples=[];for(let i=0;i<8;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:rippleTex,transparent:true,depthWrite:false,opacity:0}));m.rotation.x=-Math.PI/2;m.visible=false;bowl.add(m);ripples.push({m,t:1});}
function ripple(wx,wz,n=2){for(let k=0;k<n;k++){const r=ripples.find(r=>r.t>=1);if(!r)return;r.t=-k*0.25;r.m.position.set(wx-bowl.position.x,soupY()+0.0012,wz-bowl.position.z);r.m.visible=true;}}
let steamBoost=0;
// hanging noodle strands (sag & swing while lifting)
const hangGeo=[];for(let i=0;i<9;i++){const pts=[];for(let k=0;k<=16;k++){const t=k/16;pts.push(new THREE.Vector3(Math.sin(t*40+i)*0.002+(i-4)*0.0016,-t,Math.cos(t*37+i)*0.002+Math.sin(t*Math.PI)*0.004*(i%3-1)));}hangGeo.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),48,0.0019,5));}
const hang=new THREE.Mesh(mergeGeometries(hangGeo),noodleMat);hang.visible=false;hang.castShadow=true;scene.add(hang);

// ---------- UI ----------
const $=id=>document.getElementById(id);
let msgTimer;function say(t,best){const m=$('msg');m.textContent=t;m.className=best?'best':'';m.style.opacity=1;clearTimeout(msgTimer);msgTimer=setTimeout(()=>m.style.opacity=0,best?3200:2200);}
$('filmBtn').onclick=()=>$('wrap').classList.toggle('film');
const LINES={men:['縮れ麺に味噌がからむ','ずずっ…うまい','麺もうまいんだよなぁ','まだまだ、ずずっ','最後のひとすすり'],
 chashu:['冷たいチャーシュー、やっぱり世界一','この冷たさがいいんだ…世界一','世界一うまい。間違いない'],
 moyashi:['シャキシャキのもやし','もやしでひと休み','もやし、最後まで元気'],wakame:['わかめ、つるっと','磯の香り'],kani:['カニカマ、なつかしい'],
 menma:['メンマ、こりっ','太いメンマがいい','メンマの歯ごたえ','最後のメンマ'],
 soup:['生ニンニクが効いてる','濃い味噌、あったまる','ああ、この味だ','ニンニクがしみる','すり目が見えてきた','まだ飲める','レンゲが止まらない','あと少し','底が見えてきた','…飲み干した']};
const bar=$('bar');
function buildBar(){bar.innerHTML='';Object.values(items).forEach(it=>{const b=document.createElement('button');b.dataset.item=it.name;b.onclick=e=>{e.stopPropagation();eat(it.name);};bar.appendChild(b);});refreshBar();}
function refreshBar(){[...bar.children].forEach(b=>{const it=items[b.dataset.item];b.disabled=it.left<=0;b.textContent=it.label+(it.portions>1&&it.left>0?` ${it.left}`:'');});}

// ---------- state & camera ----------
let state='enter',busy=false,order=[],bites=[];
const camRest={pos:new THREE.Vector3(0,0.34,0.27),look:new THREE.Vector3(0,0.03,-0.03)};
const camFar={pos:new THREE.Vector3(0,0.42,0.75),look:new THREE.Vector3(0,0.15,-1.2)};
const camCur={pos:camFar.pos.clone(),look:camFar.look.clone()};
let camTarget=camFar,peek=0,yaw=0;
bowl.position.set(0,0,-0.45);bowl.visible=false;
function resetBowl(){soupLevel=1;Object.values(items).forEach(it=>{it.left=it.portions;it.objs.forEach(o=>o.visible=true);});order=[];bites=[];updateSoup();restHashi();restRenge();buildBar();}
$('enterBtn').onclick=()=>{audioInit();$('ovEnter').classList.add('hide');setTimeout(()=>$('ovMenu').classList.remove('hide'),700);};
document.querySelector('.tan[data-m=miso]').onclick=()=>{$('ovMenu').classList.add('hide');say('「味噌ひとつ！」');state='wait';kitchen(3.2);setTimeout(arrive,3300);};
function arrive(){resetBowl();bowl.visible=true;state='arrive';steamBoost=1;ripple(0,0,3);const t0=performance.now();const p0=camCur.pos.clone(),l0=camCur.look.clone();
 const step=()=>{const k=Math.min(1,(performance.now()-t0)/1600);const e=1-Math.pow(1-k,3);bowl.position.set(0,0.12*(1-e)+Math.sin(k*Math.PI)*0.02,-0.45*(1-e));
  camCur.pos.lerpVectors(p0,camRest.pos,e);camCur.look.lerpVectors(l0,camRest.look,e); // camera arrives exactly with the bowl → no early-tap misses
  if(k<1)requestAnimationFrame(step);else{camTarget=camRest;clink(600,.25);say('「はい、お待ちどう！」');state='eat';bar.style.display='flex';$('hint').textContent=isMobile?'タップで食べる／ドラッグでのぞく':'クリックで食べる・ドラッグでのぞき込む';}};step();}
$('againBtn').onclick=()=>{$('ovEnd').classList.add('hide');camCur.pos.copy(camFar.pos);camCur.look.copy(camFar.look);arrive();};

// ---------- eating ----------
const tmpV=new THREE.Vector3();
function anim(dur,fn){return new Promise(res=>{const t0=performance.now();const f=()=>{const k=Math.min(1,(performance.now()-t0)/dur);fn(k);if(k<1)requestAnimationFrame(f);else res();};f();});}
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function mouthPos(){camera.getWorldDirection(tmpV);return camera.position.clone().add(tmpV.multiplyScalar(0.13)).add(new THREE.Vector3(0,-0.035,0));}
async function eat(name){if(state!=='eat'||busy)return;const it=items[name];if(!it||it.left<=0)return;busy=true;
 const idx=it.portions-it.left;
 try{if(it.tool==='renge')await sipSoup(it,idx);else await pick(it,idx);}catch(e){console.warn(e);}
 it.left--;bites.push(it.label);if(!order.includes(it.label))order.push(it.label);
 say(LINES[name][Math.min(idx,LINES[name].length-1)],name==='chashu');
 refreshBar();busy=false;if(Object.values(items).every(i=>i.left<=0))finish();}
async function pick(it,idx){
 const obj=it.objs[idx];const start=new THREE.Vector3();
 const bb=new THREE.Box3().setFromObject(obj);bb.getCenter(start);start.y=bb.max.y;
 const h0=hashi.position.clone();const off=new THREE.Vector3(0.05,0.07,0.17);
 clink(3200,.06);
 await anim(420,k=>{const e=ease(k);hashi.position.lerpVectors(h0,start.clone().add(off),e);hashi.lookAt(start);hashi.children[0].position.x=-0.006-0.006*e;hashi.children[1].position.x=0.006+0.006*e;});
 ripple(start.x,start.z,2);const parent=obj.parent;const savedPos=obj.position.clone(),savedQ=obj.quaternion.clone(),savedS=obj.scale.clone();
 // carry a world-space clone so the original stays intact for 'もう一杯'
 const carry=obj.clone();obj.visible=false;const wp=new THREE.Vector3(),wq=new THREE.Quaternion(),ws=new THREE.Vector3();obj.matrixWorld.decompose(wp,wq,ws);
 const pivot=new THREE.Group();pivot.position.copy(start);scene.add(pivot);carry.position.copy(wp.sub(start));carry.quaternion.copy(wq);carry.scale.copy(ws);carry.visible=true;pivot.add(carry);
 hashi.children[0].position.x=-0.003;hashi.children[1].position.x=0.003;
 const mp=mouthPos();const isNoodle=it.name==='men';
 if(isNoodle){liftSteam.forEach((s,i)=>{s.visible=true;s.userData.t=i/6;});drips.forEach((d,i)=>{d.on=true;d.m.visible=true;d.m.position.copy(start);d.v=0;d.delay=i*0.12;});slurp(1.4,1);}
 else if(it.name==='moyashi')setTimeout(()=>crunch(6),500);else if(it.name==='menma')setTimeout(()=>crunch(4),500);else setTimeout(()=>chew(5),500);
 await anim(isNoodle?1300:950,k=>{const e=ease(k);const p=new THREE.Vector3().lerpVectors(start,mp,e);p.y+=Math.sin(k*Math.PI)*0.06;pivot.position.copy(p);
  const sc=isNoodle?1-0.75*e:1-0.3*e;pivot.scale.set(sc,isNoodle?1+e*2:sc,sc);
  hashi.position.copy(p.clone().add(off));hashi.lookAt(p);
  if(isNoodle){hang.visible=true;const surf=bowl.position.y+soupY();const len=Math.max(0.005,(p.y-surf)*(1-Math.max(0,(k-0.55)/0.45)));hang.position.copy(p);hang.scale.set(1,len,1);hang.rotation.set(Math.sin(k*14)*0.12*(1-k),0,Math.sin(k*11)*0.15*(1-k));if(k>0.5&&!pick.pulled){pick.pulled=1;}}
  if(isNoodle)liftSteam.forEach(s=>{s.userData.t=(s.userData.t+0.012)%1;const t=s.userData.t;s.position.copy(p).add(new THREE.Vector3(Math.sin(t*9)*0.01,t*0.06,0));s.scale.setScalar(0.03+t*0.05);s.material.opacity=0.22*(1-t);});});
 hang.visible=false;pick.pulled=0;scene.remove(pivot);liftSteam.forEach(s=>s.visible=false);
 if(it.name==='chashu')bestFlash();
 const hp=hashi.position.clone();await anim(380,k=>{hashi.position.lerpVectors(hp,h0,ease(k));});restHashi();}
async function sipSoup(it,idx){
 const pool=renge.userData.pool;const r0=renge.position.clone();
 const sc=new THREE.Vector3(bowl.position.x+0.09+R(-.006,.006),bowl.position.y+soupY()-0.002,bowl.position.z-0.014);
 await anim(450,k=>{renge.position.lerpVectors(r0,sc,ease(k));renge.rotation.set(0,1.9,0);});clink(2600,.22);
 ripple(sc.x,sc.z,3);pool.visible=true;const before=soupLevel,after=Math.max(0,1-(idx+1)/it.portions);const mp=mouthPos();
 setTimeout(()=>slurp(.7,.6),600);
 await anim(1000,k=>{renge.position.lerpVectors(sc,mp,ease(k));renge.position.y+=Math.sin(k*Math.PI)*.05;renge.rotation.set(-0.05-0.5*Math.max(0,k-.7)/.3,1.9*(1-ease(Math.min(1,k*1.6))),0);soupLevel=before+(after-before)*Math.min(1,k*2);updateSoup();});
 pool.visible=false;if(ambNodes.steam)ambNodes.steam.gain.value=0.02*soupLevel;
 const rp=renge.position.clone();restRenge();const rt=renge.position.clone();renge.position.copy(rp);
 await anim(420,k=>{renge.position.lerpVectors(rp,rt,ease(k));renge.rotation.set(-0.55*(1-ease(k)),1.9*ease(k),0);});restRenge();
 if(soupLevel<=0){renge.position.set(0.21,0.012,0.0);renge.rotation.set(0,-0.9,0);}clink(1800,.12);}
function bestFlash(){const f=document.createElement('div');f.style.cssText='position:fixed;inset:0;background:radial-gradient(circle,rgba(255,230,150,.35),rgba(255,200,80,0) 70%);pointer-events:none;z-index:3;transition:opacity 1.6s';document.body.appendChild(f);setTimeout(()=>f.style.opacity=0,300);setTimeout(()=>f.remove(),2200);
 if(AC){const t=AC.currentTime;[523,659,784,1047].forEach((fq,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=fq;g.gain.setValueAtTime(0,t+i*.09);g.gain.linearRampToValueAtTime(.06,t+i*.09+.05);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+1.2);o.connect(g).connect(master);o.start(t+i*.09);o.stop(t+i*.09+1.3);});}}
function finish(){state='done';bar.style.display='none';camTarget={pos:new THREE.Vector3(0,0.33,0.18),look:new THREE.Vector3(0,0,-0.035)};
 setTimeout(()=>{const cnt={};bites.forEach(b=>cnt[b]=(cnt[b]||0)+1);$('order').innerHTML=order.map((o,i)=>`${i+1}. ${o}${cnt[o]>1?` <small>(${cnt[o]}口)</small>`:''}`).join('<br>');$('ovEnd').classList.remove('hide');$('ovEnd').style.background='rgba(18,10,4,.45)';},2600);}

// ---------- input (pointer events; no long-press, no pinch zoom) ----------
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,p:peek,yw:yaw,moved:false};});
addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>10)down.moved=true;if(!down.moved)return;
 peek=THREE.MathUtils.clamp(down.p+dy*-0.004,-0.3,1);yaw=THREE.MathUtils.clamp(down.yw+dx*-0.002,-0.5,0.5);});
addEventListener('pointerup',e=>{if(down&&!down.moved&&state==='eat')tap(e.clientX,e.clientY);down=null;});
addEventListener('pointercancel',()=>down=null);
['contextmenu','gesturestart','dblclick'].forEach(ev=>addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
function tap(x,y){camera.updateMatrixWorld();ptr.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ptr,camera);
 const targets=[];bowl.traverse(o=>{if(o.isMesh&&o.userData.item)targets.push(o);});
 const vis=o=>{while(o){if(!o.visible)return false;o=o.parent;}return true;};
 const hits=ray.intersectObjects(targets,false).filter(h=>vis(h.object)&&items[h.object.userData.item].left>0);
 let name=hits.length?hits[0].object.userData.item:null;
 if(!name){ // generous fallback: tap anywhere on/near the bowl → closest remaining item or soup
  const bh=ray.intersectObject(bowlInner,false).length||ray.intersectObject(bowlOuter,false).length;if(!bh)return;name=items.soup.left>0?'soup':Object.values(items).find(i=>i.left>0)?.name;}
 if(name)eat(name);}

// ---------- loop + auto quality ----------
function applyTier(){const T=TIERS[tier];renderer.setPixelRatio(T.pr);renderer.shadowMap.enabled=T.shadow;key.castShadow=T.shadow;if(T.shadow){key.shadow.mapSize.set(T.map,T.map);if(key.shadow.map){key.shadow.map.dispose();key.shadow.map=null;}}
 steams.forEach((s,i)=>s.visible=i<T.steam);scene.traverse(o=>{if(o.material&&!Array.isArray(o.material))o.material.needsUpdate=true;});resize();}
let last=performance.now(),fpsAcc=0,fpsN=0,goodRuns=0;const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;const t=clock.getElapsedTime();
 fpsAcc+=(now-(loop.prev||now))/1000;loop.prev=now;fpsN++;
 if(fpsAcc>2.5){const fps=fpsN/fpsAcc;if(fps<42&&tier>0){tier--;applyTier();}fpsAcc=0;fpsN=0;}
 if(state!=='arrive'){const ck=1-Math.exp(-dt*3);camCur.pos.lerp(camTarget.pos,ck);camCur.look.lerp(camTarget.look,ck);}
 const breath=Math.sin(t*1.6)*0.002;const p=camCur.pos.clone();p.y+=breath-peek*0.11;p.z-=peek*0.16;p.x+=Math.sin(yaw)*0.1;
 camera.position.copy(p);const lk=camCur.look.clone();lk.x+=-yaw*0.3;lk.y+=peek*-0.02;camera.lookAt(lk);camera.rotation.z+=Math.sin(t*.7)*0.002;
 steamBoost=Math.max(0,steamBoost-dt*0.08);ripples.forEach(r=>{if(r.t>=1)return;r.t+=dt*0.9;const k=Math.max(0,r.t);r.m.scale.setScalar(0.01+k*0.07);r.m.material.opacity=r.t<0?0:0.35*(1-k);r.m.position.y=soupY()+0.0012;if(r.t>=1)r.m.visible=false;});
 const y=soupY();steams.forEach((s,si)=>{const u=s.userData;u.t+=dt*(0.1+steamBoost*0.08);if(u.t>1){u.t=0;u.a=R(0,6.28);u.r=R(0,.09);}const k=u.t;
  const curl=k*k*0.05;s.position.set(Math.cos(u.a)*u.r+Math.sin(t*.8+k*6+si)*0.012+Math.cos(t*.5+si)*curl,y+0.015+k*(0.2+steamBoost*0.1),Math.sin(u.a)*u.r+Math.sin(t*.6+si)*curl);s.scale.setScalar((si%2?0.04:0.07)+k*(si%2?0.09:0.16));s.material.rotation=u.rot*k*2+Math.sin(t*.3+si)*.3;s.material.opacity=(0.1+steamBoost*0.12)*Math.sin(k*Math.PI)*(0.2+0.8*soupLevel)*(bowl.visible?1:0);});
 drips.forEach(d=>{if(!d.on)return;d.delay-=dt;if(d.delay>0)return;d.v-=9.8*dt*0.3;d.m.position.y+=d.v*dt;if(d.m.position.y<bowl.position.y+y){d.on=false;d.m.visible=false;}});
 soupMat.normalMap.offset.set(Math.sin(t*.15)*0.01,t*0.002);
 renderer.render(scene,camera);}
function resize(){const w=innerWidth,h=innerHeight,portrait=h>w;camera.aspect=w/h;camera.fov=portrait?Math.min(72,50*(h/w)*0.62+20):48;camera.updateProjectionMatrix();renderer.setSize(w,h);}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
applyTier();updateSoup();restHashi();restRenge();loop();
window.__game={get state(){return state},get busy(){return busy},items,eat,get soupLevel(){return soupLevel},get order(){return order},get tier(){return tier},tap,camera,renge,toppingsRoot,THREE,restRenge};
